body:
  - type: markdown
    attributes:
      value: |
        Ask away. Questions that sound basic are welcome.

        Bugs (something broke) go in the **Issues** tab instead.
  - type: textarea
    id: question
    attributes:
      label: Your question
    validations:
      required: true
  - type: input
    id: studio-pro-build
    attributes:
      label: Studio Pro build
      description: Help > About in Studio Pro. The tested build is 8.1.2.113407.
    validations:
      required: false
  - type: textarea
    id: tried
    attributes:
      label: Which packages do you have, and what have you tried?
    validations:
      required: false
